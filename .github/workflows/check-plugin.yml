name: Check Zotero plugin

on:
  pull_request:
    paths:
      - "DocBoxTrans-Zotero/**"
      - ".github/workflows/check-plugin.yml"
  push:
    branches: [main, master]
    paths:
      - "DocBoxTrans-Zotero/**"
      - ".github/workflows/check-plugin.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DocBoxTrans-Zotero
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: DocBoxTrans-Zotero/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
