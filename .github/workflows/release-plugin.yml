name: Release Zotero Plugin

# 插件端（DocBoxTrans-Zotero）发布：推送 `v*` 标签时触发
# 约定：标签必须等于插件的版本（DocBoxTrans-Zotero/package.json 的 version），例如版本 0.3.2 → 标签 v0.3.2。
# 说明：脚手架在 CI 中不会自增版本，而是据此标签发布：
#   - 创建 `v<version>` Release，并上传 .xpi
#   - 更新 `release` 更新清单 Release，并上传 update.json（供自动更新读取）
# 发布流程：先把 package.json 的 version 提到目标版本并推送代码，再推送同名标签 v<version>。

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DocBoxTrans-Zotero
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: DocBoxTrans-Zotero/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build & release
        run: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
