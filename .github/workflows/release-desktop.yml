name: Release Desktop

# 桌面端（DocBoxTrans）发布：推送 `desktop-v*` 标签时触发
# 产物：DocBoxTrans.exe / DocBoxTransConfig.exe 打包为 zip，挂到该标签的 Release

on:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build (build.ps1)
        shell: pwsh
        run: ./DocBoxTrans/build.ps1

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path DocBoxTrans/DocBoxTrans.exe,DocBoxTrans/DocBoxTransConfig.exe,DocBoxTrans/DocBoxTrans.ico -DestinationPath "DocBoxTrans-${{ github.ref_name }}.zip"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: "DocBoxTrans-${{ github.ref_name }}.zip"
          generate_release_notes: true
