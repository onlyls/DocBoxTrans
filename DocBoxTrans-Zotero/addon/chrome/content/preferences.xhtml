<linkset>
  <html:link rel="localization" href="__addonRef__-preferences.ftl" />
</linkset>
<vbox id="zotero-prefpane-__addonRef__" onload="Zotero.__addonInstance__.hooks.onPrefsLoad(event)">
<html:div id="__addonRef__-settings" class="dbt-settings">
  <html:div class="dbt-tabs" role="tablist" data-l10n-id="pref-tabs-label">
    <html:button type="button" id="__addonRef__-tab-general" role="tab" aria-controls="__addonRef__-panel-general" aria-selected="true" tabindex="0" data-l10n-id="pref-tab-general"></html:button>
    <html:button type="button" id="__addonRef__-tab-services" role="tab" aria-controls="__addonRef__-panel-services" aria-selected="false" tabindex="-1" data-l10n-id="pref-tab-services"></html:button>
    <html:button type="button" id="__addonRef__-tab-reading" role="tab" aria-controls="__addonRef__-panel-reading" aria-selected="false" tabindex="-1" data-l10n-id="pref-tab-reading"></html:button>
    <html:button type="button" id="__addonRef__-tab-about" role="tab" aria-controls="__addonRef__-panel-about" aria-selected="false" tabindex="-1" data-l10n-id="pref-tab-about"></html:button>
  </html:div>
  <html:section id="__addonRef__-panel-general" role="tabpanel" aria-labelledby="__addonRef__-tab-general">
  <groupbox>
    <label><html:h2 data-l10n-id="pref-general"></html:h2></label>
    <checkbox
      id="__addonRef__-enableAuto"
      data-l10n-id="pref-enableAuto"
      native="true"
      preference="__prefsPrefix__.enableAuto"
    />
    <checkbox
      id="__addonRef__-enablePopup"
      data-l10n-id="pref-enablePopup"
      native="true"
      preference="__prefsPrefix__.enablePopup"
    />
    <checkbox
      id="__addonRef__-showServiceSelector"
      data-l10n-id="pref-showServiceSelector"
      native="true"
      preference="__prefsPrefix__.showServiceSelector"
    />
    <hbox align="center">
      <label data-l10n-id="pref-fontSize"></label>
      <html:input
        id="__addonRef__-fontSize"
        type="text"
        preference="__prefsPrefix__.fontSize"
      ></html:input>
    </hbox>

  </groupbox>
  <groupbox>
    <label><html:h2 data-l10n-id="pref-service"></html:h2></label>
    <hbox align="center">
      <label data-l10n-id="pref-service-targetLanguage"></label>
      <html:input
        id="__addonRef__-targetLanguage"
        type="text"
        preference="__prefsPrefix__.targetLanguage"
        style="min-width: 120px"
      ></html:input>
    </hbox>
    <html:p class="dbt-hint" data-l10n-id="pref-service-hint"></html:p>
  </groupbox>
  </html:section>
  <html:section id="__addonRef__-panel-services" role="tabpanel" aria-labelledby="__addonRef__-tab-services" hidden="hidden">
    <html:p class="dbt-hint" data-l10n-id="pref-services-intro"></html:p>
    <html:div class="dbt-service-layout">
      <html:div class="dbt-service-navigation">
        <html:button id="__addonRef__-service-add" type="button" data-l10n-id="pref-service-add"></html:button>
        <html:div id="__addonRef__-service-list" role="group" data-l10n-id="pref-service-list"></html:div>
      </html:div>
      <html:div class="dbt-service-details">
        <html:div id="__addonRef__-llm-editor"></html:div>
        <html:div id="__addonRef__-builtin-youdao" hidden="hidden">  <groupbox>
    <label><html:h2 data-l10n-id="pref-youdao"></html:h2></label>
    <hbox align="center">
      <label data-l10n-id="pref-youdao-appKey"></label>
      <html:input
        id="__addonRef__-youdao-appKey"
        type="password"
        preference="__prefsPrefix__.youdao.appKey"
        style="min-width: 220px"
      ></html:input>
      <checkbox
        id="__addonRef__-youdao-appKey-show"
        data-l10n-id="pref-secret-show"
        native="true"
      />
    </hbox>
    <hbox align="center">
      <label data-l10n-id="pref-youdao-secret"></label>
      <html:input
        id="__addonRef__-youdao-secret"
        type="password"
        preference="__prefsPrefix__.youdao.secret"
        style="min-width: 220px"
      ></html:input>
      <checkbox
        id="__addonRef__-youdao-secret-show"
        data-l10n-id="pref-secret-show"
        native="true"
      />
    </hbox>
    <hbox align="center">
      <label data-l10n-id="pref-youdao-mode"></label>
      <menulist
        id="__addonRef__-youdao-mode"
        native="true"
      >
        <menupopup>
          <menuitem data-l10n-id="pref-youdao-mode-auto" value="auto" />
          <menuitem data-l10n-id="pref-youdao-mode-text" value="text" />
          <menuitem data-l10n-id="pref-youdao-mode-llm" value="llm" />
        </menupopup>
      </menulist>
    </hbox>
    <hbox align="center">
      <button
        id="__addonRef__-youdao-test"
        data-l10n-id="pref-test-connection"
      ></button>
    </hbox>
    <label id="__addonRef__-youdao-testResult"></label>
    <html:p class="dbt-hint" data-l10n-id="pref-youdao-hint"></html:p>
  </groupbox></html:div>
        <html:div id="__addonRef__-builtin-google" hidden="hidden">    <hbox align="center">
      <label data-l10n-id="pref-google-endpoint"></label>
      <html:input
        type="text"
        preference="__prefsPrefix__.google.endpoint"
        style="min-width: 300px"
      ></html:input>
    </hbox>    <hbox align="center">
      <label data-l10n-id="pref-google-proxy"></label>
      <html:input
        type="text"
        preference="__prefsPrefix__.google.proxy"
        style="min-width: 300px"
      ></html:input>
    </hbox></html:div>
        <html:div id="__addonRef__-builtin-bing" hidden="hidden">    <hbox align="center">
      <label data-l10n-id="pref-bing-endpoint"></label>
      <html:input
        type="text"
        preference="__prefsPrefix__.bing.endpoint"
        style="min-width: 300px"
      ></html:input>
    </hbox></html:div>
        <html:div id="__addonRef__-builtin-tencent" hidden="hidden">    <hbox align="center">
      <label data-l10n-id="pref-tencent-endpoint"></label>
      <html:input
        type="text"
        preference="__prefsPrefix__.tencent.endpoint"
        style="min-width: 300px"
      ></html:input>
    </hbox></html:div>
        <html:div id="__addonRef__-builtin-cnki" hidden="hidden">    <hbox align="center">
      <label data-l10n-id="pref-cnki-maxChars"></label>
      <html:input
        type="text"
        preference="__prefsPrefix__.cnki.maxChars"
        style="max-width: 80px"
      ></html:input>
    </hbox></html:div>
        <html:p id="__addonRef__-builtin-hint" class="dbt-hint" hidden="hidden" data-l10n-id="pref-builtin-hint"></html:p>
        <html:p id="__addonRef__-service-message" role="status" aria-live="polite"></html:p>
      </html:div>
    </html:div>
  </html:section>
  <html:section id="__addonRef__-panel-reading" role="tabpanel" aria-labelledby="__addonRef__-tab-reading" hidden="hidden">
    <checkbox id="__addonRef__-preprocessText" data-l10n-id="pref-preprocessText"
      native="true" preference="__prefsPrefix__.preprocessText" />
  <groupbox>
    <label><html:h2 data-l10n-id="pref-context"></html:h2></label>
    <checkbox
      id="__addonRef__-contextEnable"
      data-l10n-id="pref-context-enable"
      native="true"
      preference="__prefsPrefix__.contextEnable"
    />
    <hbox align="center">
      <label data-l10n-id="pref-context-maxItems"></label>
      <html:input
        type="text"
        preference="__prefsPrefix__.contextMaxItems"
        style="max-width: 80px"
      ></html:input>
    </hbox>
    <hbox align="center">
      <label data-l10n-id="pref-context-maxChars"></label>
      <html:input
        type="text"
        preference="__prefsPrefix__.contextMaxChars"
        style="max-width: 100px"
      ></html:input>
    </hbox>
    <html:p class="dbt-hint" data-l10n-id="pref-context-hint"></html:p>
  </groupbox>
  <groupbox>
    <label><html:h2 data-l10n-id="pref-combine"></html:h2></label>
    <hbox align="center">
      <label data-l10n-id="pref-combine-addShortcut"></label>
      <html:input
        id="__addonRef__-combine-addShortcut"
        type="text"
        preference="__prefsPrefix__.combineAddShortcut"
        style="min-width: 140px"
      ></html:input>
    </hbox>
    <hbox align="center">
      <label data-l10n-id="pref-combine-translateShortcut"></label>
      <html:input
        id="__addonRef__-combine-translateShortcut"
        type="text"
        preference="__prefsPrefix__.combineTranslateShortcut"
        style="min-width: 140px"
      ></html:input>
    </hbox>
    <html:p class="dbt-hint" data-l10n-id="pref-combine-hint"></html:p>
  </groupbox>
  <groupbox>
    <label><html:h2 data-l10n-id="pref-history"></html:h2></label>
    <checkbox
      id="__addonRef__-reuseTranslation"
      data-l10n-id="pref-reuseTranslation"
      native="true"
      preference="__prefsPrefix__.reuseTranslation"
    />
    <html:p class="dbt-hint" data-l10n-id="pref-history-hint"></html:p>
  </groupbox>
  </html:section>
  <html:section id="__addonRef__-panel-about" role="tabpanel" aria-labelledby="__addonRef__-tab-about" hidden="hidden">
  <groupbox>
    <label><html:h2 data-l10n-id="pref-about"></html:h2></label>
    <html:p class="dbt-hint"
      data-l10n-id="pref-about-version"
      data-l10n-args='{"name":"__addonName__","version":"__buildVersion__","time":"__buildTime__"}'
    ></html:p>
  </groupbox>
  </html:section>
</html:div>
</vbox>
